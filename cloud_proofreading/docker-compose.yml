version: '3.8'

services:
  # The hardware-accelerated Napari Streaming Container
  napari_stream:
    build: 
      context: ../
      dockerfile: cloud_proofreading/napari_stream/Dockerfile
    image: ${DOCKERHUB_USERNAME:-yourusername}/napari-cloud:latest
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, graphics, display]
    environment:
      - INPUT_RAW=${INPUT_RAW:-}
      - INPUT_CW=${INPUT_CW:-}
      - INPUT_MASK=${INPUT_MASK:-}
      - INPUT_SOMAS=${INPUT_SOMAS:-}
    volumes:
      - ${DATA_DIR:-./data}:/data
    expose:
      - "8080"

  # Google OAuth2 Reverse Proxy Gateway
  oauth2_proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    restart: unless-stopped
    environment:
      - OAUTH2_PROXY_PROVIDER=google
      - OAUTH2_PROXY_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - OAUTH2_PROXY_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${COOKIE_SECRET}
      - OAUTH2_PROXY_COOKIE_SECURE=true
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_UPSTREAMS=http://napari_stream:8080
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_REDIRECT_URL=https://${SERVER_IP}.nip.io/oauth2/callback
    expose:
      - "4180"

  # Caddy: Auto-HTTPS and Let's Encrypt Certificate Generation
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${SERVER_IP}.nip.io --to oauth2_proxy:4180
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
